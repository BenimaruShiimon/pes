# /etc/poe_watchdog.conf
# Format:
#   <port>  <ip>  <interval_sec>  <fail_threshold>  <cooldown_sec>  <cycle_pause_sec> [monitor_iface idle_threshold [mode [watch_scope [link_timeout_sec]]]]
#   port             — идентификатор PoE-порта в формате, понятном poe_ctl.sh
#   ip               — IP адрес устройства за PoE-портом
#   interval_sec     — период ping, сек
#   fail_threshold   — сколько подряд неудачных ping перед power-cycle
#   cooldown_sec     — пауза после power-cycle перед следующей проверкой
#   cycle_pause_sec  — пауза между off и on внутри power-cycle
#   monitor_iface    — необязательный интерфейс для контроля потока пакетов и carrier
#   idle_threshold   — секунд без трафика до power-cycle
#   mode             — режим после восстановления, напр. SEMIAUTO / AUTO / OFF
#   watch_scope      — куда смотреть: port, os, link, both (по умолчанию both)
#   link_timeout_sec — секунд без carrier до power-cycle, если watch_scope содержит link

G01    192.168.1.11    5    3    60    5
G02    192.168.1.12    5    3    60    5
G05    192.168.1.15   10    3   120    5
# Пример: смотреть только на трафик ОСИ:
# G01    192.168.1.11    5    3    60    5 eth0 30 SEMIAUTO os
# Пример: смотреть на ping + трафик:
# G01    192.168.1.11    5    3    60    5 eth0 30 SEMIAUTO both
