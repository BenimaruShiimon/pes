# /etc/poe_watchdog.conf
# Format:
#   <port>  <interval_sec>  <fail_threshold>  <cooldown_sec>  <cycle_pause_sec>  <monitor_iface>  <idle_threshold> [mode [watch_scope [link_timeout_sec]]]
#   port             — идентификатор PoE-порта в формате, понятном poe_ctl.sh
#   interval_sec     — период проверки интерфейса, сек
#   fail_threshold   — количество повторов до power-cycle
#   cooldown_sec     — пауза после power-cycle перед следующей проверкой
#   cycle_pause_sec  — пауза между off и on внутри power-cycle
#   monitor_iface    — обязательный физический интерфейс для контроля carrier/трафика
#   idle_threshold   — секунд без трафика до power-cycle
#   mode             — режим после восстановления, напр. SEMIAUTO / AUTO / OFF
#   watch_scope      — смотреть только по: os, link, both
#   link_timeout_sec — секунд без carrier до power-cycle, если watch_scope содержит link

G01    5    3    60    5    eth0    30    SEMIAUTO    link    20
G02    5    3    60    5    eth0    30    SEMIAUTO    link    20
G05   10    3   120    5    eth0    60    SEMIAUTO    both    30
# Пример: смотреть только на трафик ОСИ:
# G01    5    3    60    5    eth0    30    SEMIAUTO    os
# Пример: смотреть на carrier + трафик:
# G01    5    3    60    5    eth0    30    SEMIAUTO    both    20
